<h2 mat-dialog-title>
    {{ entityId ? 'Edit Jabatan' : 'Tambah Jabatan' }}
</h2>

<div class="dialog-body">   <!-- wrapper baru -->
    <div *ngIf="loading" class="loader">
        <mat-progress-spinner diameter="48" mode="indeterminate"></mat-progress-spinner>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="position-form" *ngIf="!loading">
        <mat-form-field appearance="outline" class="full">
            <mat-label>Nama</mat-label>
            <input matInput formControlName="name" placeholder="Nama jabatan" />
            <mat-error *ngIf="form.get('name')?.hasError('required')">Nama wajib diisi</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Deskripsi</mat-label>
            <textarea matInput formControlName="description" rows="4"></textarea>
        </mat-form-field>

        <div class="actions">
            <button mat-flat-button color="primary" type="submit" [disabled]="saving">
                <mat-icon *ngIf="!saving">save</mat-icon>
                <mat-progress-spinner *ngIf="saving" diameter="18" mode="indeterminate"></mat-progress-spinner>
                <span class="btn-label">{{ saving ? 'Menyimpan...' : 'Simpan' }}</span>
            </button>

            <button mat-button type="button" (click)="cancel()" [disabled]="saving">Batal</button>
        </div>
    </form>
</div>
