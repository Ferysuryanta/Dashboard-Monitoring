<div class="position-page">
    <div class="toolbar">
        <h2>Jabatan</h2>
        <div class="actions">
            <button mat-flat-button color="primary" (click)="openAdd()">
                <mat-icon>add</mat-icon>
                Tambah Jabatan
            </button>
        </div>
    </div>

    <mat-card *ngIf="loading" class="loading-card">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
    </mat-card>

    <div *ngIf="!loading && data.length === 0" class="empty-state">
        <p>Tidak ada jabatan. Klik "Tambah Jabatan" untuk menambahkan.</p>
    </div>

    <table mat-table [dataSource]="data" class="mat-elevation-z1 position-table" *ngIf="!loading && data.length > 0">
        <!-- Name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nama</th>
            <td mat-cell *matCellDef="let e">{{ e.name }}</td>
        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Deskripsi</th>
            <td mat-cell *matCellDef="let e">{{ e.description || '-' }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Aksi</th>
            <td mat-cell *matCellDef="let e">
                <button mat-icon-button color="primary" (click)="openEdit(e)" matTooltip="Edit">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="remove(e)" matTooltip="Hapus">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator *ngIf="!loading && length > 0"
                   [length]="length"
                   [pageSize]="pageSize"
                   [pageIndex]="pageIndex"
                   (page)="onPageChange($event)">
    </mat-paginator>
</div>
