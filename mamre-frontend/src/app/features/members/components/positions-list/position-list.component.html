<section class="page">
    <div class="page-header">
        <div class="title">
            <h2>Jabatan</h2>
            <p class="desc">Kelola data jabatan yang tersedia. Gunakan tombol 'Tambah Jabatan' untuk menambahkan data baru.</p>
        </div>

        <div class="controls">
            <button mat-flat-button color="primary" (click)="openAdd()">
                <mat-icon>add</mat-icon>
                Tambah Jabatan
            </button>
        </div>
    </div>

    <div class="table-content-wrapper">
        <mat-card *ngIf="loading" class="loading-card">
            <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        </mat-card>

        <div *ngIf="!loading && data.length === 0" class="empty-state">
            <p>Tidak ada jabatan. Klik "Tambah Jabatan" untuk menambahkan.</p>
        </div>

        <table mat-table [dataSource]="data" class="position-table" *ngIf="!loading && data.length > 0">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="col-name">Nama</th>
                <td mat-cell *matCellDef="let e" class="col-name">
                    <span class="name-txt">{{ e.name }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef class="col-description">Deskripsi</th>
                <td mat-cell *matCellDef="let e" class="col-description">{{ e.description || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="col-actions">Aksi</th>
                <td mat-cell *matCellDef="let e" class="col-actions">
                    <button mat-icon-button color="primary" (click)="openEdit(e)" matTooltip="Edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="remove(e)" matTooltip="Hapus">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns" class="row"></tr>
        </table>
    </div>

    <mat-paginator
            *ngIf="!loading && length > pageSize"
            [length]="length"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            [pageSizeOptions]="[5, 10, 20, 50]"
            (page)="onPageChange($event)">
    </mat-paginator>
</section>
