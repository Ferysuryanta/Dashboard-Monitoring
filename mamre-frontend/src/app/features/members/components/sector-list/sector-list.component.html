<section class="page">
    <div class="page-header">
        <div class="title">
            <h2>Sektors</h2>
            <p class="desc">Kelola data sektor. Gunakan tombol 'Tambah Sektor' untuk menambahkan data baru.</p>
        </div>

        <div class="controls">
            <button mat-flat-button color="primary" (click)="openAdd()">
                <mat-icon>add</mat-icon> Tambah Sektor
            </button>
        </div>
    </div>

    <div class="table-content-wrapper">
        <mat-card *ngIf="loading" class="loading-card">
            <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        </mat-card>

        <table mat-table [dataSource]="data" class="sector-table" *ngIf="!loading">
            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef class="col-code">Kode</th>
                <td mat-cell *matCellDef="let e" class="col-code">{{ e.code || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="col-name">Nama</th>
                <td mat-cell *matCellDef="let e" class="col-name">
                    <span class="name-txt">{{ e.name }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef class="col-description">Deskripsi</th>
                <td mat-cell *matCellDef="let e" class="col-description">{{ e.description || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="col-actions">Aksi</th>
                <td mat-cell *matCellDef="let e" class="col-actions">
                    <button mat-icon-button color="primary" matTooltip="Edit" (click)="openEdit(e)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Hapus" (click)="remove(e)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="row"></tr>
        </table>
    </div>

    <mat-paginator
            [length]="length"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            [pageSizeOptions]="[5, 10, 20, 50]"
            (page)="onPageChange($event)">
    </mat-paginator>

    <div *ngIf="!loading && data.length === 0" class="empty-state">
        Tidak ada data sektor ditemukan.
    </div>

</section>
