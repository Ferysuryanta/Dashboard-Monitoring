<div class="sector-page">
    <div class="toolbar">
        <h2>Sektors</h2>
        <div class="actions">
            <button mat-flat-button color="primary" (click)="openAdd()"><mat-icon>add</mat-icon> Tambah Sektor</button>
        </div>
    </div>

    <mat-card *ngIf="loading" class="loading-card">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
    </mat-card>

    <table mat-table [dataSource]="data" class="mat-elevation-z1 sector-table" *ngIf="!loading">
        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Kode</th>
            <td mat-cell *matCellDef="let e">{{ e.code || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nama</th>
            <td mat-cell *matCellDef="let e">{{ e.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Deskripsi</th>
            <td mat-cell *matCellDef="let e">{{ e.description || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Aksi</th>
            <td mat-cell *matCellDef="let e">
                <button mat-icon-button color="primary" (click)="openEdit(e)"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="remove(e)"><mat-icon>delete</mat-icon></button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [length]="length" [pageSize]="pageSize" [pageIndex]="pageIndex"
                   (page)="onPageChange($event)" aria-label="Paginasi Sektor">
    </mat-paginator>
</div>
