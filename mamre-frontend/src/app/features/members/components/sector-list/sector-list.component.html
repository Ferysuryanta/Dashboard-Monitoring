<section class="page">
    <div class="page-header">
        <div class="title">
            <h2>📍 Sectors</h2>
            <p class="desc">Manage sector data. Use the 'Add Sector' button to create new sectors.</p>
        </div>

        <div class="controls">
            <button mat-flat-button color="primary" (click)="openAdd()">
                <mat-icon>add</mat-icon> Add Sector
            </button>
        </div>
    </div>

    <div class="table-content-wrapper">
        <mat-card *ngIf="loading" class="loading-card">
            <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        </mat-card>

        <table mat-table [dataSource]="data" class="sector-table" *ngIf="!loading">
            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef class="col-code">Code</th>
                <td mat-cell *matCellDef="let e" class="col-code">{{ e.code || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="col-name">Name</th>
                <td mat-cell *matCellDef="let e" class="col-name">
                    <span class="name-txt">{{ e.name }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef class="col-description">Description</th>
                <td mat-cell *matCellDef="let e" class="col-description">{{ e.description || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="col-actions">Actions</th>
                <td mat-cell *matCellDef="let e" class="col-actions">
                    <button mat-icon-button color="primary" matTooltip="Edit" (click)="openEdit(e)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Delete" (click)="remove(e)">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="row"></tr>
        </table>

        <div *ngIf="!loading && data.length === 0" class="empty-state">
            No sectors found. Click "Add Sector" to create one.
        </div>
    </div>

    <mat-paginator
            *ngIf="!loading && length > pageSize"
            [length]="length"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            [pageSizeOptions]="[5, 10, 20, 50]"
            (page)="onPageChange($event)">
    </mat-paginator>

</section>
