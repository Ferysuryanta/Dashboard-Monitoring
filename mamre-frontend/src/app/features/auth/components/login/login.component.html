<div class="login-container">
    <div class="login-background">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>

    <mat-card class="login-card">
        <div class="login-header">
            <div class="brand-logo">
                <div class="logo-avatar">M</div>
                <h1>Mamre</h1>
            </div>
            <p class="login-subtitle">Dashboard Monitoring Gereja</p>
        </div>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username" placeholder="Masukkan username" autocomplete="username">
                    <mat-icon matPrefix>person</mat-icon>
                    <mat-error *ngIf="f['username'].hasError('required')">Username wajib diisi</mat-error>
                    <mat-error *ngIf="f['username'].hasError('minlength')">Username minimal 3 karakter</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password"
                           [type]="hidePassword ? 'password' : 'text'"
                           placeholder="Masukkan password"
                           autocomplete="current-password">
                    <mat-icon matPrefix>lock</mat-icon>
                    <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                    <mat-error *ngIf="f['password'].hasError('required')">Password wajib diisi</mat-error>
                    <mat-error *ngIf="f['password'].hasError('minlength')">Password minimal 6 karakter</mat-error>
                </mat-form-field>

                <div class="form-options">
                    <mat-checkbox formControlName="rememberMe" color="primary">
                        Ingat saya
                    </mat-checkbox>
                    <a href="#" class="forgot-link">Lupa password?</a>
                </div>

                <button mat-flat-button color="primary" type="submit"
                        class="login-button"
                        [disabled]="isLoading">
                    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
                    <span *ngIf="!isLoading">Login</span>
                </button>
            </form>
        </mat-card-content>

        <div class="login-footer">
            <p>Belum punya akun? <a routerLink="/register" class="register-link">Daftar di sini</a></p>
        </div>
    </mat-card>

    <div class="copyright">
        &copy; 2026 Mamre Church. All rights reserved.
    </div>
</div>
