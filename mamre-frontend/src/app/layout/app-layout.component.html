<mat-sidenav-container class="layout-shell">
    <mat-sidenav #sidenav mode="side" class="app-sidenav" [opened]="isSidenavOpen">
        <div class="sidenav-header">
            <div class="brand">
                <div class="brand-avatar">M</div>
                <div class="brand-text" *ngIf="isSidenavOpen">
                    <h3>Mamre</h3>
                </div>
            </div>
        </div>

        <mat-nav-list>
            <!-- Main -->
            <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
                <mat-icon>dashboard</mat-icon>
                <span *ngIf="isSidenavOpen">Dashboard</span>
            </a>

            <a mat-list-item routerLink="/members" routerLinkActive="active-link">
                <mat-icon>groups</mat-icon>
                <span *ngIf="isSidenavOpen">Members</span>
            </a>

            <!-- Divider: Attendance -->
            <div class="nav-section-label" *ngIf="isSidenavOpen">Attendance</div>
            <mat-divider *ngIf="!isSidenavOpen"></mat-divider>

            <a mat-list-item routerLink="/attendance" routerLinkActive="active-link">
                <mat-icon>event_available</mat-icon>
                <span *ngIf="isSidenavOpen">Attendance</span>
            </a>

            <a mat-list-item routerLink="/attendance-report" routerLinkActive="active-link">
                <mat-icon>bar_chart</mat-icon>
                <span *ngIf="isSidenavOpen">Attendance Report</span>
            </a>

            <!-- Divider: Bible Reading -->
            <div class="nav-section-label" *ngIf="isSidenavOpen">Bible Reading</div>
            <mat-divider *ngIf="!isSidenavOpen"></mat-divider>

            <a mat-list-item routerLink="/bible-reading" routerLinkActive="active-link">
                <mat-icon>menu_book</mat-icon>
                <span *ngIf="isSidenavOpen">Bible Reading</span>
            </a>

            <a mat-list-item routerLink="/bible-reading-report" routerLinkActive="active-link">
                <mat-icon>assessment</mat-icon>
                <span *ngIf="isSidenavOpen">Reading Report</span>
            </a>

            <!-- Divider: Settings -->
            <div class="nav-section-label" *ngIf="isSidenavOpen">Settings</div>
            <mat-divider *ngIf="!isSidenavOpen"></mat-divider>

            <a mat-list-item routerLink="/sectors" routerLinkActive="active-link">
                <mat-icon>location_on</mat-icon>
                <span *ngIf="isSidenavOpen">Sectors</span>
            </a>

            <a mat-list-item routerLink="/positions" routerLinkActive="active-link">
                <mat-icon>badge</mat-icon>
                <span *ngIf="isSidenavOpen">Positions</span>
            </a>
        </mat-nav-list>

        <div class="sidenav-footer">
            <button mat-button (click)="toggleSidebar()" class="collapse-btn" aria-label="Toggle sidebar">
                <mat-icon>{{ isSidenavOpen ? 'chevron_left' : 'chevron_right' }}</mat-icon>
                <span *ngIf="isSidenavOpen">Collapse</span>
            </button>
        </div>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar class="app-header mat-elevation-z2">
            <div class="left-group">
                <button mat-icon-button (click)="toggleSidebar()" aria-label="Toggle menu">
                    <mat-icon>menu</mat-icon>
                </button>
                <span class="title">Dashboard Mamre</span>
            </div>

            <div class="right-group">
                <button mat-icon-button matTooltip="Notifications" aria-label="Notifications">
                    <mat-icon>notifications</mat-icon>
                </button>

                <!-- profile menu / avatar -->
                <div class="avatar-small" (click)="onProfileClick()" role="button" aria-label="User menu">F</div>
            </div>
        </mat-toolbar>

        <div class="content">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
