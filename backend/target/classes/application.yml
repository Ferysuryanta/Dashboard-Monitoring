spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mamre
    username: postgres
    password: 12345
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

---
spring:
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      FAIL_ON_EMPTY_BEANS: false

app:
  cors:
    allowed-origins: "http://localhost:4200"

server:
  port: 8080
